ndal height, urine for protein, repeat haemoglobin.","ரத்த அழுத்தம், கருப்பை உயரம், சிறுநீரில் புரதம், ஹீமோகுளோபின்.","बीपी, गर्भाशय की ऊँचाई, यूरिन में प्रोटीन, हीमोग्लोबिन।")},{id:"anc-m7-growth",month:7,kind:"scan",title:i("Growth scan","வளர்ச்சி ஸ்கேன்","ग्रोथ स्कैन"),detail:i("Ultrasound for fetal growth, position and amniotic fluid.","குஞ்சின் வளர்ச்சி, நிலை, தண்ணீர் அளவு ஸ்கேன்.","शिशु की वृद्धि, स्थिति व तरल का अल्ट्रासाउंड।")},{id:"anc-m7-kicks",month:7,kind:"visit",title:i("Start daily kick count","தினமும் அடி எண்ணத் தொடங்குங்கள்","रोज़ हलचल गिनना शुरू करें"),detail:i("Count 10 movements after meals; report reduced movement immediately.","உணவுக்குப் பிறகு 10 அசைவுகள் எண்ணுங்கள்; குறைந்தால் உடனே தெரிவிக்கவும்.","खाने के बाद 10 हलचलें गिनें; कम हो तो तुरंत बताएं।")},{id:"anc-m8-visit",month:8,kind:"visit",title:i("Fourth ANC check-up","நான்காம் கர்ப்ப பரிசோதனை","चौथी एएनसी जांच"),detail:i("BP, weight, position of baby, birth preparedness plan.","ரத்த அழுத்தம், எடை, குஞ்சின் நிலை, பிரசவ தயாரிப்புத் திட்டம்.","बीपी, वजन, शिशु की स्थिति, डिलीवरी की तैयारी।")},{id:"anc-m8-hb",month:8,kind:"test",title:i("Repeat haemoglobin & urine","ஹீமோகுளோபின் & சிறுநீர் மீண்டும்","हीमोग्लोबिन व यूरिन दोबारा"),detail:i("Anaemia must be corrected before delivery.","பிரசவத்திற்கு முன் இரத்த சோகையை சரிசெய்ய வேண்டும்.","डिलीवरी से पहले खून की कमी ठीक करना ज़रूरी।")},{id:"anc-m9-weekly",month:9,kind:"visit",title:i("Weekly check-ups","வாராந்திர பரிசோதனைகள்","साप्ताहिक जांच"),detail:i("From 36 weeks, weekly visits to check BP, position and heart rate.","36 வாரங்களிலிருந்து வாரம் ஒருமுறை — ரத்த அழுத்தம், நிலை, துடிப்பு.","36 हफ़्तों से हर हफ़्ते जांच — बीपी, स्थिति व धड़कन।")},{id:"anc-m9-scan",month:9,kind:"scan",title:i("Term scan & delivery planning","முழுக்கால ஸ்கேன் & பிரசவத் திட்டம்","टर्म स्कैन व डिलीवरी प्लान"),detail:i("Confirm presentation, plan the delivery centre, arrange transport and blood donor.","குஞ்சின் நிலையை உறுதிச் செய்து, பிரசவ இடம், வாகனம், ரத்ததானம் ஏற்பாடு.", मतली/चक्कर में भी व्यायाम")]},{trimester:2,label:i("Second trimester","இரண்டாம் கட்டம்","दूसरा ट्राइमेस्टर"),items:[i("Lying flat on the back","முதுகில் படுத்தல்","पीठ के बल लेटना"),i("Deep abdominal twists","ஆழ்ந்த வயிற்று திருப்பங்கள்","गहरे पेट के ट्विस्ट"),i("Balance-dependent moves","சமநிலை தேவைப்படும் அசைவுகள்","संतुलन वाले कदम"),i("Holding the breath during effort","உழைப்பின் போது மூச்சு பிடித்தல்","ज़ोर लगाते समय सांस रोकना")]},{trimester:3,label:i("Third trimester","மூன்றாம் கட்டம்","तीसरा ट्राइमेस्टर"),items:[i("Anything on the back","முதுகில் படும் எதுவும்","पीठ के बल कुछ भी"),i("Squats beyond comfort","வசதிக்கு அப்பாற்பட்ட உட்கார்தல்","आराम से ज़्यादा स्क्वाट"),i("Long standing sessions","நீண்ட நேரம் நிற்க","लंबे समय खड़े रहना"),i("Continuing if you feel contractions, leaking or bleeding","வலி/நீர்/ரத்தம் இருந்தும் தொடர்தல்","दर्द/पानी/खून होने पर भी जारी रखना")]}],Od=[{urgency:"emergency",title:i("Bleeding from the vagina","யோனியில் ரத்தப்போக்கு","योनि से खून आना"),detail:i("Any heavy bleeding or clots — go to the hospital immediately.","அதிக ரத்தப்போக்கு அல்லது கட்டிகள் — உடனே மருத்துவமனைக்கு.","ज़्यादा खून या कट्टे — तुरंत अस्पताल जाएं।")},{urgency:"emergency",title:i("Convulsions / fits, or severe headache with blurred vision","வலிப்பு, அல்லது கடும் தலைவலியுடன் கண் மங்கல்","दौरे, या तेज़ सिरदर्द के साथ धुंधला दिखना"),detail:i("Signs of eclampsia or dangerously high blood pressure.","எக்ளாம்ப்சியா அல்லது ஆபத்தான அளவு ரத்த அழுத்தத்தின் அறிகுறிகள்.","एक्लैम्पसिया या खतरनाक बीपी के संकेत।")},{urgency:"emergency",title:i("Baby moving less than usual or not at all","குஞ்சு வழக்கத்திற்கு மாறாகக் குறைவாக அசைதல்","शिशु की हलचल कम या बंद"),detail:i("After 28 weeks, fewer than 10 kicks in 12 hours needs same-day checking.","28 வாரங்களுக்குப் பிறகு 12 மணி நேரத்தில் 10-க்கும் குறைவு — அன்றே பரிசோதிக்கவும்.","28 हफ़्तों बाद 12 घंटों में 10 से कम — उसी दिन जांच कराएं।")},{urgency:"emergency",title:i("Water breaking before labour starts","பிரசவம் தொடங்கும் முன்பே நீ
